version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: terraform
    directory: /infra/github
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ['*']
