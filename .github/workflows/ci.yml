name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.13.1'

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: '1.10.19'
      - run: uv sync --frozen --python '${{ matrix.python }}'
      - name: Tests including real Quarto renders
        run: uv run --frozen pytest --cov=cx_sentiment --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=pytest.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-python-${{ matrix.python }}
          path: |
            coverage.xml
            pytest.xml
          if-no-files-found: error
          retention-days: 7

  static:
    name: Ruff and Pyright
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pyright
      - run: git diff --check
      - name: Check changed lines for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/check_changed_whitespace.sh

  package:
    name: Package smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build and test installed package
        run: bash .github/scripts/smoke_package.sh

  automation:
    name: Automation validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Validate workflows and guard behavior
        run: |
          bash .github/scripts/install_ci_tool.sh actionlint "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/actionlint"
          python -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: terraform -chdir=infra/github fmt -check -diff
      - run: terraform -chdir=infra/github init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/github validate

  quality:
    name: Quality
    if: always()
    needs: [tests, static, package, automation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every dependency to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['NEEDS_JSON'])
          assert results and all(job['result'] == 'success' for job in results.values()), results
          PY

  branch-policy:
    name: Branch policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check release PR source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          if os.environ['EVENT_NAME'] == 'pull_request':
              with open(os.environ['GITHUB_EVENT_PATH']) as handle:
                  pr = json.load(handle)['pull_request']
              if pr['base']['ref'] == 'main':
                  assert pr['head']['ref'] == 'dev', 'Release PRs must originate from dev.'
                  assert pr['head']['repo']['full_name'] == os.environ['REPOSITORY'], 'Release PRs must originate from this repository.'
          PY
