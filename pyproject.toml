[project]
name = "cx-sentiment-benchmark"
version = "0.1.0"
description = "Offline-first multilingual CX sentiment routing benchmark"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "dataframely>=3.1,<4",
  "httpx>=0.27,<1",
  "openai>=2.0,<3",
  "polars>=1.35,<2",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
]

[project.scripts]
cx-sentiment = "cx_sentiment.cli:main"

[dependency-groups]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cx_sentiment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
